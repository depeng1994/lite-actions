name: Lint and CPU smoke checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: Lint and CPU smoke / queue contracts
    runs-on: ubuntu-latest
    steps:
      # For a PR, github.sha is GitHub's proposed merge commit; for a push it is
      # the pushed commit. The checkout is therefore the code being validated.
      - name: Check out the proposed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record the tested commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          printf 'Tested commit: %s\nPR head: %s\n' "$actual" "${PR_HEAD_SHA:-not a pull request}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python scripts/lint.py
      - name: Full unit suite, including CPU smoke and queue contracts
        run: python -m unittest discover -s tests -v
