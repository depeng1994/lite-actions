name: PR77 permission policy CPU container
on:
  push:
    branches: [ci/verify-pr77-permissions]
    paths: [.github/workflows/verify-pr77-permissions.yml]
permissions:
  contents: read
jobs:
  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.12-bookworm
      options: --init
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c16a56c72240e8a17133cc81c759babe45e1f42a
          persist-credentials: false
      - name: Verify exact PR revision
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = c16a56c72240e8a17133cc81c759babe45e1f42a
      - run: python -m pip install -r requirements-dev.txt
      - name: Formatting, lint, shared policy and shell syntax
        run: |
          ruff format --check
          ruff check
          python -B scripts/lint.py
          bash -n scripts/install_auto_update.sh auto_update/bootstrap.sh
      - name: Blue and Yellow diagnostics including nobody reads
        run: python -B -m unittest tests.test_diagnostic_permissions -v
      - name: Full CPU regression suite
        run: python -B -m unittest discover -s tests
