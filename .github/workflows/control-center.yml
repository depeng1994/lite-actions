name: Control Center validation
on:
  pull_request:
    paths:
      - 'control-center/**'
      - 'ci_core/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'unified_router.py'
      - '.github/workflows/control-center.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend, frontend, and lint dependencies
        run: |
          npm ci --prefix control-center/worker
          npm ci --prefix control-center/web
          python -m pip install -r requirements-dev.txt
      - name: Worker tests and wire upload gate
        run: |
          python scripts/lint.py
          python -m unittest tests/test_upload_intercept.py -v
          python -m unittest discover -s tests
      - name: Frontend build, Sites packaging, and unit tests
        run: |
          npm run build --prefix control-center/web
          npm test --prefix control-center/web
          SITES_PROJECT_ID=sites_ci_fixture_project CONTROL_CENTER_API_ORIGIN=https://control-center-ci.example \
            node control-center/scripts/build-sites.mjs --require-origin
      - name: Control Center SDK, D1, and dual-runtime portability gates
        working-directory: control-center/worker
        run: |
          npm run lint
          npx wrangler d1 migrations apply DB --local
          npm test
          npm run test:portability
      - name: Dual Worker API integration (D1 & Node 24 SQLite parity)
        run: |
          python control-center/tests/integration/run.py --runtime=d1
          python control-center/tests/integration/run.py --runtime=node
