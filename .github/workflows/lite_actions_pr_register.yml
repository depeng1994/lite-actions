name: lite-ci-pr-register
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
  pull-requests: read
jobs:
  register:
    if: github.repository == 'depeng1994/lite-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register PR gate generation or reconcile on close
        env:
          CC_URL: ${{ vars.LITE_CI_CONTROL_CENTER_URL }}
          GATE_TOKEN: ${{ secrets.LITE_CI_GATE_TOKEN }}
          EVENT_ACTION: ${{ github.event.action }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HTML_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -z "${CC_URL:-}" ] || [ -z "${GATE_TOKEN:-}" ]; then
            echo "Control Center URL or gate token unavailable (e.g. fork PR); skipping registration."
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = os.environ["CC_URL"].rstrip("/")
          token = os.environ["GATE_TOKEN"]
          action = os.environ["EVENT_ACTION"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "lite-actions-pr-register",
          }
          if action == "closed":
              url = f"{base}/api/v1/pr-gate/reconcile"
              payload = json.dumps({"repo": os.environ["REPO_NAME"]}).encode("utf-8")
          else:
              url = f"{base}/api/v1/pr-gate/register"
              payload = json.dumps(
                  {
                      "repo": os.environ["REPO_NAME"],
                      "pr_number": int(os.environ["PR_NUMBER"]),
                      "pr_head_sha": os.environ["PR_HEAD_SHA"],
                      "status": "PENDING",
                      "required_suites": ["deploy", "smoke_self", "smoke_gitcode", "cleanup"],
                      "target_url": os.environ["PR_HTML_URL"],
                      "summary": f"PR #{os.environ['PR_NUMBER']} awaiting hardware gate",
                      "author_login": os.environ["PR_AUTHOR"],
                      "trigger_actor": os.environ["TRIGGER_ACTOR"],
                  }
              ).encode("utf-8")
          req = urllib.request.Request(url, data=payload, headers=headers, method="POST")
          with urllib.request.urlopen(req, timeout=20) as resp:
              body = resp.read().decode("utf-8")
              if resp.status < 200 or resp.status >= 300:
                  raise SystemExit(f"Gate coordinator HTTP {resp.status}: {body}")
              print(body)
          PY
