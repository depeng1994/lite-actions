name: Deploy Control Center

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (production uses the workflow's main commit)
        required: true
        default: main
        type: string
      deploy_server:
        description: Publish the frontend to the production Control Center
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production ref
        if: ${{ inputs.deploy_server && (github.ref != 'refs/heads/main' || (inputs.ref != 'main' && inputs.ref != github.sha)) }}
        run: |
          echo "::error::Run a production deployment from main with ref=main or its workflow commit."
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_server && github.sha || inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm ci --prefix control-center/worker
          npm ci --prefix control-center/web
      - name: Validate and build
        run: |
          npm run lint --prefix control-center/worker
          npm test --prefix control-center/worker
          npm test --prefix control-center/web
          npm run build:node --prefix control-center/worker
          npm run build --prefix control-center/web
          python3 control-center/tests/integration/run.py
      - name: Package personal-server release
        run: |
          mkdir -p release/control-center
          cp -a control-center/worker release/control-center/
          cp -a control-center/web/dist release/control-center/web-dist
          cp -a config release/config
          tar -czf lite-actions-control-center.tar.gz -C release control-center config
      - uses: actions/upload-artifact@v4
        with:
          name: lite-actions-control-center
          path: lite-actions-control-center.tar.gz
          if-no-files-found: error
      - name: Package the production frontend
        if: ${{ inputs.deploy_server }}
        run: tar -czf lite-actions-control-center-web.tar.gz -C control-center/web/dist index.html assets
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.deploy_server }}
        with:
          name: lite-actions-control-center-web
          path: lite-actions-control-center-web.tar.gz
          if-no-files-found: error

  publish-web:
    if: ${{ inputs.deploy_server }}
    needs: build
    runs-on: ubuntu-latest
    environment: control-center-production
    concurrency:
      group: control-center-production
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lite-actions-control-center-web
      - name: Publish through the authorized server deploy hook
        env:
          SERVER_DEPLOY_COMMAND: ${{ secrets.SERVER_DEPLOY_COMMAND }}
        run: |
          if [ -z "${SERVER_DEPLOY_COMMAND}" ]; then
            echo "::error::deploy_server=true requires SERVER_DEPLOY_COMMAND."
            exit 1
          fi
          export RELEASE_ARCHIVE="$PWD/lite-actions-control-center-web.tar.gz"
          bash -euo pipefail -c "${SERVER_DEPLOY_COMMAND}"
