name: Deploy Control Center

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: website/control-center-prd
        type: string
      build_sites_package:
        description: Also build deployable ChatGPT Sites frontend-proxy package using SITES_PROJECT_ID & CONTROL_CENTER_API_ORIGIN secrets
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Worker dependencies
        run: npm ci --prefix control-center/worker

      - name: Apply remote D1 migrations
        working-directory: control-center/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Control Center Worker
        working-directory: control-center/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Build and verify deployable ChatGPT Sites frontend-proxy package
        if: ${{ inputs.build_sites_package }}
        env:
          SITES_PROJECT_ID: ${{ secrets.SITES_PROJECT_ID }}
          CONTROL_CENTER_API_ORIGIN: ${{ secrets.CONTROL_CENTER_API_ORIGIN }}
        run: |
          npm ci --prefix control-center/web
          node control-center/scripts/build-sites.mjs --require-origin
          curl -fsS "${CONTROL_CENTER_API_ORIGIN%/}/api/v1/public/overview" > /dev/null
          echo "Sites package ready in control-center/dist; deploy to ChatGPT Sites with runtime secret CONTROL_CENTER_API_ORIGIN set."
