name: lite-ci-self-smoke
run-name: "Lite Actions self smoke: ${{ inputs.profile || 'full' }}"
on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Select cpu-only to verify a deployment without allocating NPUs'
        type: choice
        required: true
        default: full
        options: [full, cpu-only]
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    if: >-
      github.repository == 'depeng1994/lite-actions' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.profile == 'cpu-only' && 10 || 180 }}
    steps:
      # The Worker, request artifact and checkout must all refer to this merge,
      # not the PR head or a later main commit. Fail before creating a request.
      - name: Verify the merged revision
        if: github.event_name == 'pull_request_target'
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [[ "$GITHUB_SHA" != "$MERGE_SHA" ]]; then
            echo '::error::Workflow SHA does not match the merged PR; no smoke request submitted.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare the pinned repository plan
        env:
          SELF_SMOKE_PROFILE: ${{ inputs.profile || 'full' }}
        run: python3 -m ci_core.self_smoke prepare
      - uses: actions/upload-artifact@v4
        with:
          name: lite-ci-request-${{ github.run_attempt }}
          path: .ci-request/ci-request.json
          if-no-files-found: error
          retention-days: 1
      - name: Wait for all selected cases and verified cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RESULT_AUTHOR: ${{ vars.LITE_CI_RESULT_ACTOR }}
        run: python3 -m ci_core.self_smoke wait
