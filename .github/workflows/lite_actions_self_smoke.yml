name: lite-ci-self-smoke
run-name: "Lite Actions self smoke: ${{ inputs.profile || 'full' }}"
on:
  # main requires a PR with no bypass. A push to this ref exposes the actual
  # landed SHA both in GITHUB_SHA and in the REST run consumed by Blue.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Select cpu-only to verify a deployment without allocating NPUs'
        type: choice
        required: true
        default: full
        options: [full, cpu-only]
permissions:
  contents: read
  actions: read
env:
  SELF_SMOKE_PROFILE: ${{ inputs.profile || 'full' }}
jobs:
  prepare:
    if: github.repository == 'depeng1994/lite-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Verify the revision the Worker will see
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          worker_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .head_sha)
          if [[ "$worker_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Run head $worker_sha differs from checkout $GITHUB_SHA; no request submitted."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare the pinned repository plan
        id: plan
        run: |
          set -euo pipefail
          python3 -m ci_core.self_smoke prepare
          jq -r '.cases[] | "\(.case_id): \(.kind), \(.resources.nodes) nodes × \(.resources.devices_per_node) NPUs"' .ci-request/ci-request.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lite-ci-request-${{ github.run_attempt }}
          path: .ci-request/ci-request.json
          if-no-files-found: error
          retention-days: 1

  smoke:
    needs: prepare
    runs-on: ubuntu-latest
    name: ${{ matrix.case_id }}
    timeout-minutes: ${{ inputs.profile == 'cpu-only' && 10 || 180 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: lite-ci-request-${{ github.run_attempt }}
          path: .ci-request
      - name: Wait for assigned Lite Actions worker
        env:
          SELF_SMOKE_CASE_ID: ${{ matrix.case_id }}
          GH_TOKEN: ${{ github.token }}
          CI_RESULT_AUTHOR: ${{ vars.LITE_CI_RESULT_ACTOR }}
        run: python3 -m ci_core.self_smoke wait-case

  result:
    if: always() && needs.prepare.result != 'skipped'
    needs: [prepare, smoke]
    runs-on: ubuntu-latest
    name: Lite-Actions-Smoke
    steps:
      - env:
          PREPARE: ${{ needs.prepare.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: test "$PREPARE" = success && test "$SMOKE" = success
